apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-adapter
  namespace: monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alertmanager-adapter
  template:
    metadata:
      labels:
        app: alertmanager-adapter
    spec:
      containers:
        - name: adapter
          image: alertmanager-adapter:latest # Replace with your registry image and immutable tag.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CONFIG_PATH
              value: /app/config/config.yaml
          envFrom:
            - secretRef:
                name: alertmanager-adapter-secret
          volumeMounts:
            - name: config
              mountPath: /app/config/config.yaml
              subPath: config.yaml
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: [ALL]
      volumes:
        - name: config
          configMap:
            name: alertmanager-adapter-config
