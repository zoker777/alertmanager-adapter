apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: alertmanager-adapter
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: alertmanager-adapter
  namespaceSelector:
    matchNames: [monitoring]
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
