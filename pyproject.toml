[project]
name = "alertmanager-adapter"
version = "0.1.0"
description = "Stateless Alertmanager webhook adapter for Feishu, DingTalk and WeCom"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.8,<3",
    "httpx>=0.27,<1",
    "PyYAML>=6,<7",
    "prometheus-client>=0.20,<1",
    "tenacity>=9,<10",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
